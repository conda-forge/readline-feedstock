{% set version = "8.3" %}

package:
  name: readline
  version: "{{ version }}"

source:
  url:
  - https://ftp.gnu.org/gnu/readline/readline-{{ version }}.tar.gz
  - https://ftpmirror.gnu.org/readline/readline-{{ version }}.tar.gz
  sha256: fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc
  # Official upstream patches from https://ftp.gnu.org/gnu/readline/readline-8.3-patches/
  patches:
    - official-patches/readline83-001
    - official-patches/readline83-002
    - official-patches/readline83-003
    - official-patches/readline83-004
    - official-patches/readline83-005
    - official-patches/readline83-006

build:
  skip: true  # [win]
  number: 2
  run_exports:
    # change soname at major ver: https://abi-laboratory.pro/tracker/timeline/readline/
    - {{ pin_subpackage('readline') }}

requirements:
  build:
    - pkg-config
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - make
    - libtool
  host:
    - ncurses
  run:
    - ncurses

test:
  commands:
  {% set readline_libs = [
    'libreadline',
    'libhistory'
  ] %}
  {% for lib in readline_libs %}
    - test ! -f ${PREFIX}/lib/{{ lib }}.a
    - test -f ${PREFIX}/lib/{{ lib }}${SHLIB_EXT}  # [not win]
  {% endfor %}

about:
  home: https://cnswww.cns.cwru.edu/php/chet/readline/rltop.html
  license: GPL-3.0-only
  license_file: COPYING
  summary: library for editing command lines as they are typed in

extra:
  recipe-maintainers:
    - croth1
    - jakirkham
    - pelson
    - msarahan
    - asmeurer
    - msarahan
    - ocefpaf
    - h-vetinari
